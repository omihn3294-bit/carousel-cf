<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#090a12">
<title>استوديو الشرائح — أي فكرة، إلى شرائح مصممة</title>
<meta name="description" content="حوّل أي فكرة أو درس أو بيانات أو منتج إلى شرائح مصممة بالذكاء الاصطناعي، بعدد متغيّر وهوية لكل طلب.">
<script>
  (function () {
    var lang = 'ar', theme = 'dark';
    try {
      var saved = JSON.parse(localStorage.getItem('carousel-prefs') || '{}');
      if (saved.lang === 'en' || saved.lang === 'ar') lang = saved.lang;
      else if ((navigator.language || '').toLowerCase().indexOf('ar') !== 0) lang = 'en';
      if (saved.theme === 'dark' || saved.theme === 'light') theme = saved.theme;
      else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
    } catch (e) {}
    var root = document.documentElement;
    root.lang = lang;
    root.dir = lang === 'en' ? 'ltr' : 'rtl';
    root.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;700;800&family=Almarai:wght@400;700;800&family=Readex+Pro:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;700;800&family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..900&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="slides.css">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="dots-bg"></div>
</div>

<div class="page">
<header>
  <div class="wrap header-inner">
    <a class="brand" href="#top">
      <span class="mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><rect x="1.5" y="3" width="10.5" height="14" rx="2.6" fill="#fff" fill-opacity=".96"/><rect x="13.6" y="5.2" width="4.4" height="9.6" rx="2.2" fill="#fff" fill-opacity=".55"/></svg>
      </span>
      <span data-i18n="brand">استوديو الشرائح</span>
    </a>
    <div class="controls">
      <div class="seg" role="group" data-i18n-aria="langGroup">
        <button type="button" class="seg-btn" data-lang="ar" aria-pressed="true" lang="ar">العربية</button>
        <button type="button" class="seg-btn" data-lang="en" aria-pressed="false" lang="en">English</button>
      </div>
      <button type="button" class="icon-btn" id="themeBtn" aria-pressed="false" data-i18n-aria="themeToLight">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.6 8.6 0 1 1 9.8 3.5a6.9 6.9 0 0 0 10.7 10.7Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <section class="stage wrap">
    <h1 class="hero-title" data-i18n="heroTitle">ماذا تريد أن تصمّم اليوم؟</h1>
    <p class="hero-lead" data-i18n="heroLead">صف فكرة، درسًا، تحليل بيانات، منتجًا، أو اقتباسًا. المحرك يختار عدد الشرائح والهوية والتكوين — لا قالب جاهز.</p>

    <div class="composer" id="composer">
      <div class="attach-row" id="attachRow" hidden>
        <img id="thumb" alt="">
        <span id="fileName"></span>
        <button type="button" class="mini-x" id="removePhoto" data-i18n-aria="removePhoto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <label class="sr-only" for="desc" data-i18n="descLabel">وصف الفكرة</label>
      <textarea id="desc" maxlength="1400" rows="1" data-i18n-ph="descPlaceholder"></textarea>

      <div class="composer-meta">
        <label class="field" for="handle">
          <span>@</span>
          <input id="handle" maxlength="30" autocomplete="off" spellcheck="false" data-i18n-ph="handlePlaceholder">
        </label>
        <label class="field" for="count">
          <span data-i18n="countLabel">عدد الشرائح</span>
          <select id="count">
            <option value="auto">تلقائي</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </label>
      </div>

      <div class="composer-bar">
        <label class="attach-btn" for="photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.8" cy="9.8" r="1.7"/><path d="M21 16l-5-5-7.5 7.5"/></svg>
          <span data-i18n="attach">أرفق صورة</span>
        </label>
        <input class="sr-only" type="file" id="photo" accept="image/*">
        <span class="counter" id="counter"></span>
        <button type="button" class="send" id="go" data-i18n-aria="generate">
          <span class="spinner" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
        </button>
      </div>
    </div>

    <div class="chips" id="chips"></div>
    <p class="hint" data-i18n="hint"></p>
    <p class="status" id="msg" role="status" aria-live="polite"></p>
  </section>

  <section id="results" class="results wrap" aria-labelledby="resultsTitle">
    <div class="results-bar">
      <div>
        <h2 id="resultsTitle" data-i18n="resultsTitle">شرائحك جاهزة</h2>
        <p class="results-sub" data-i18n="resultsSub"></p>
      </div>
      <div class="bar-actions">
        <button type="button" class="btn-ghost" id="restyle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20v-4h-4"/></svg>
          <span data-i18n="restyle">تصميم آخر</span>
        </button>
        <button type="button" class="btn-ghost" id="all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5"/><path d="M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17"/></svg>
          <span data-i18n="downloadAll">تحميل الكل</span>
        </button>
      </div>
    </div>
    <p class="note" id="resultNote" hidden></p>
    <div class="slides" id="slides"></div>
  </section>

  <footer>
    <p data-i18n="footer"></p>
  </footer>
</main>
</div>

</body>
</html>
