<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#090a12">
<title>مولّد المنشورات — شرائح احترافية بالذكاء الاصطناعي</title>
<meta name="description" content="حوّل وصف منتجك إلى أربع شرائح جاهزة للنشر بالعربية الفصحى أو الإنجليزية.">
<script>
  // ضبط اللغة والمظهر قبل الرسم لتفادي الوميض
  (function () {
    var lang = 'ar', theme = 'dark';
    try {
      var saved = JSON.parse(localStorage.getItem('carousel-prefs') || '{}');
      if (saved.lang === 'en' || saved.lang === 'ar') lang = saved.lang;
      else if ((navigator.language || '').toLowerCase().indexOf('ar') !== 0) lang = 'en';
      if (saved.theme === 'dark' || saved.theme === 'light') theme = saved.theme;
      else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
    } catch (e) {}
    var root = document.documentElement;
    root.lang = lang;
    root.dir = lang === 'en' ? 'ltr' : 'rtl';
    root.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --font-ar: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
    --font-en: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --ease: cubic-bezier(.22, .68, .32, 1);
  }

  /* ============ الألوان ============ */
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #090a12;
    --ink: #eceef8;
    --ink-soft: #c3c8de;
    --muted: #8a90ab;
    --line: rgba(255, 255, 255, .10);
    --line-strong: rgba(255, 255, 255, .20);
    --surface-2: rgba(255, 255, 255, .06);
    --glass: rgba(18, 20, 36, .66);
    --brand: #9185ff;
    --brand-2: #3fd8ea;
    --brand-soft: rgba(145, 133, 255, .16);
    --on-brand: #070813;
    --ring: rgba(145, 133, 255, .30);
    --blob-1: #5b4bf0; --blob-2: #0ea5c6; --blob-3: #a21caf;
    --blob-o: .42;
    --dot: rgba(255, 255, 255, .075);
    --shadow: 0 30px 80px -30px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .02);
    --danger: #ff7a6e;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f6fd;
    --ink: #11132a;
    --ink-soft: #383c5c;
    --muted: #666b8a;
    --line: rgba(20, 24, 70, .10);
    --line-strong: rgba(20, 24, 70, .20);
    --surface-2: rgba(20, 24, 70, .05);
    --glass: rgba(255, 255, 255, .80);
    --brand: #5646ee;
    --brand-2: #0891b2;
    --brand-soft: rgba(86, 70, 238, .10);
    --on-brand: #ffffff;
    --ring: rgba(86, 70, 238, .22);
    --blob-1: #8b7dff; --blob-2: #4fd0e6; --blob-3: #f0a6e8;
    --blob-o: .50;
    --dot: rgba(20, 24, 70, .09);
    --shadow: 0 30px 70px -34px rgba(40, 40, 120, .35), 0 0 0 1px rgba(255, 255, 255, .6);
    --danger: #d92d20;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  html[lang="ar"] { --font-body: var(--font-ar); }
  html[lang="en"] { --font-body: var(--font-en); }

  body {
    margin: 0; min-height: 100vh; position: relative; overflow-x: hidden;
    font-family: var(--font-body); font-size: 16px; line-height: 1.65;
    color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    transition: background-color .35s var(--ease), color .35s var(--ease);
  }
  .wrap { width: 100%; max-width: 1040px; margin-inline: auto; padding-inline: 22px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }

  /* ============ الخلفية: توهّج ناعم + شبكة نقاط ============ */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(110px); opacity: var(--blob-o);
    will-change: transform; animation: drift 26s ease-in-out infinite alternate;
  }
  .blob.b1 { width: 52vmax; height: 52vmax; background: var(--blob-1); top: -22vmax; inset-inline-start: -10vmax; }
  .blob.b2 { width: 44vmax; height: 44vmax; background: var(--blob-2); top: 6vmax; inset-inline-end: -16vmax; animation-duration: 32s; animation-delay: -8s; }
  .blob.b3 { width: 36vmax; height: 36vmax; background: var(--blob-3); bottom: -20vmax; inset-inline-start: 22vw; opacity: calc(var(--blob-o) * .7); animation-duration: 38s; animation-delay: -15s; }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(4vmax, 5vmax, 0) scale(1.12); }
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(var(--dot) 1.1px, transparent 1.2px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 20%, transparent 78%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 20%, transparent 78%);
  }

  .page { position: relative; z-index: 1; }

  /* ============ الشريط العلوي ============ */
  .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 72px; }
  .brand { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .mark {
    width: 36px; height: 36px; flex: none; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(140deg, var(--brand), var(--brand-2));
    box-shadow: 0 10px 24px -10px var(--brand);
  }
  .controls { display: flex; align-items: center; gap: 10px; }
  .seg {
    display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .seg-btn {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 13.5px; font-weight: 700; line-height: 1.2; cursor: pointer;
    padding: 7px 15px; border-radius: 999px;
    transition: color .2s var(--ease), background-color .2s var(--ease);
  }
  .seg-btn:hover { color: var(--ink); }
  .seg-btn[aria-pressed="true"] { color: var(--on-brand); background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
  .icon-btn {
    width: 40px; height: 40px; flex: none; display: grid; place-items: center; cursor: pointer;
    border-radius: 50%; color: var(--ink-soft);
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    transition: color .2s var(--ease), border-color .2s var(--ease);
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }
  .icon-btn svg { width: 19px; height: 19px; }
  .icon-btn .i-moon { display: none; }
  html[data-theme="dark"] .icon-btn .i-moon { display: block; }
  html[data-theme="dark"] .icon-btn .i-sun { display: none; }

  /* ============ الواجهة الرئيسية ============ */
  .stage { max-width: 780px; padding-block: clamp(44px, 11vh, 120px) 20px; text-align: center; }
  .hero-title {
    margin: 0 0 14px; font-size: clamp(2rem, 5.6vw, 3.4rem); font-weight: 800;
    line-height: 1.3; letter-spacing: -.02em;
    background: linear-gradient(100deg, var(--ink) 25%, var(--brand) 62%, var(--brand-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  html[lang="en"] .hero-title { line-height: 1.12; letter-spacing: -.035em; }
  .hero-lead { margin: 0 auto 34px; max-width: 560px; color: var(--muted); font-size: clamp(15.5px, 2vw, 17.5px); line-height: 1.75; }

  /* شريط الإدخال */
  .composer {
    position: relative; text-align: start;
    background: var(--glass); border: 1px solid var(--line); border-radius: 30px;
    -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4);
    box-shadow: var(--shadow);
    transition: border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  .composer:focus-within { border-color: var(--brand); box-shadow: var(--shadow), 0 0 0 4px var(--ring), 0 0 60px -12px var(--brand); }
  .composer.is-drag { border-color: var(--brand-2); box-shadow: var(--shadow), 0 0 0 4px var(--brand-soft); }

  .composer textarea {
    display: block; width: 100%; min-height: 60px; max-height: 220px; resize: none; overflow-y: auto;
    margin: 0; padding: 22px 24px 6px; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 17px; line-height: 1.7; color: var(--ink);
  }
  .composer textarea::placeholder { color: var(--muted); }

  .attach-row { display: flex; align-items: center; gap: 10px; padding: 16px 20px 0; }
  .attach-row[hidden] { display: none; }
  .attach-row img { width: 44px; height: 44px; flex: none; border-radius: 12px; object-fit: cover; border: 1px solid var(--line); }
  .attach-row span { flex: 0 1 auto; min-width: 0; max-width: 240px; font-size: 13.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-x {
    width: 28px; height: 28px; flex: none; display: grid; place-items: center; cursor: pointer;
    border-radius: 50%; border: 0; background: var(--surface-2); color: var(--muted);
    transition: color .2s var(--ease), background-color .2s var(--ease);
  }
  .mini-x:hover { color: var(--ink); background: var(--line); }
  .mini-x svg { width: 14px; height: 14px; }

  .composer-bar { display: flex; align-items: center; gap: 10px; padding: 6px 12px 12px 12px; }
  .attach-btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 9px 15px; border-radius: 999px; font-size: 14px; font-weight: 700; color: var(--ink-soft);
    background: var(--surface-2); border: 1px solid transparent;
    transition: color .2s var(--ease), border-color .2s var(--ease), background-color .2s var(--ease);
  }
  .attach-btn:hover, .attach-btn:focus-within { color: var(--ink); border-color: var(--line-strong); }
  .attach-btn svg { width: 18px; height: 18px; flex: none; }
  .counter { margin-inline-start: auto; font-size: 12.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .counter.near { color: var(--danger); }

  .send {
    width: 46px; height: 46px; flex: none; display: grid; place-items: center; cursor: pointer;
    border: 0; border-radius: 50%; color: var(--on-brand);
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    box-shadow: 0 12px 26px -10px var(--brand);
    transition: transform .2s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease);
  }
  .send:hover:not(:disabled) { transform: translateY(-2px) scale(1.04); filter: saturate(1.15); }
  .send:active:not(:disabled) { transform: none; }
  .send:disabled { cursor: wait; }
  .send svg { width: 21px; height: 21px; }
  .send .spinner { display: none; width: 20px; height: 20px; border: 2.4px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .75s linear infinite; }
  .send.is-loading svg { display: none; }
  .send.is-loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 20px; }
  .chip {
    appearance: none; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    color: var(--ink-soft); background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 16px; transition: color .2s var(--ease), border-color .2s var(--ease), background-color .2s var(--ease);
  }
  .chip:hover { color: var(--ink); border-color: var(--brand); background: var(--brand-soft); }

  .hint { margin: 18px 0 0; color: var(--muted); font-size: 13px; }
  .status { margin: 10px 0 0; min-height: 24px; font-size: 14px; color: var(--muted); }
  .status.err { color: var(--danger); font-weight: 700; }
  .status.busy {
    background: linear-gradient(90deg, var(--muted) 30%, var(--ink) 50%, var(--muted) 70%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* ============ النتائج ============ */
  .results { display: none; padding-block: clamp(48px, 8vw, 80px) 0; scroll-margin-top: 24px; }
  .results.show { display: block; animation: rise .55s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .results-bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .results-bar h2 { margin: 0 0 4px; font-size: clamp(22px, 3vw, 28px); font-weight: 800; letter-spacing: -.02em; }
  .results-sub { margin: 0; color: var(--muted); font-size: 14.5px; }

  .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; color: var(--ink);
    background: var(--glass); border: 1px solid var(--line-strong); border-radius: 999px; padding: 9px 18px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    transition: border-color .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
  }
  .btn-ghost:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); transform: translateY(-1px); }
  .btn-ghost:disabled { opacity: .6; cursor: default; }
  .btn-ghost svg { width: 16px; height: 16px; flex: none; }

  .note { margin: 0 0 18px; padding: 11px 16px; border-radius: 14px; background: var(--brand-soft); color: var(--ink-soft); font-size: 13.5px; }
  .note[hidden] { display: none; }

  .slides { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 24px; }
  .slide-card { min-width: 0; }
  .slide-head { display: flex; align-items: baseline; gap: 10px; padding: 0 4px 10px; }
  .slide-index { font-size: 13px; font-weight: 800; color: var(--brand); font-variant-numeric: tabular-nums; }
  .slide-role { font-size: 13.5px; font-weight: 700; color: var(--muted); }
  .slide-card canvas {
    display: block; width: 100%; height: auto; border-radius: 22px; background: var(--surface-2);
    box-shadow: 0 26px 50px -28px rgba(0, 0, 0, .6); transition: transform .25s var(--ease);
  }
  .slide-card canvas:hover { transform: translateY(-3px); }
  .slide-foot { display: flex; padding: 12px 4px 0; }
  .slide-foot .btn-ghost { padding: 7px 15px; font-size: 13px; }

  footer { padding-block: clamp(56px, 8vw, 90px) 36px; text-align: center; color: var(--muted); font-size: 13px; }
  footer p { margin: 0; }

  @media (max-width: 720px) {
    .slides { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .wrap { padding-inline: 14px; }
    .header-inner { height: 64px; }
    .composer { border-radius: 26px; }
    .composer textarea { font-size: 16px; padding: 18px 18px 4px; }
    .attach-btn span { display: none; }
    .attach-btn { padding: 10px; }
    .seg-btn { padding: 7px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .blob { animation: none; }
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="dots"></div>
</div>

<div class="page">
<header>
  <div class="wrap header-inner">
    <a class="brand" href="#top">
      <span class="mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><rect x="1.5" y="3" width="10.5" height="14" rx="2.6" fill="#fff" fill-opacity=".96"/><rect x="13.6" y="5.2" width="4.4" height="9.6" rx="2.2" fill="#fff" fill-opacity=".55"/></svg>
      </span>
      <span data-i18n="brand">مولّد المنشورات</span>
    </a>
    <div class="controls">
      <div class="seg" role="group" data-i18n-aria="langGroup">
        <button type="button" class="seg-btn" data-lang="ar" aria-pressed="true" lang="ar">العربية</button>
        <button type="button" class="seg-btn" data-lang="en" aria-pressed="false" lang="en">English</button>
      </div>
      <button type="button" class="icon-btn" id="themeBtn" aria-pressed="false" data-i18n-aria="themeToLight">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.6 8.6 0 1 1 9.8 3.5a6.9 6.9 0 0 0 10.7 10.7Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <section class="stage wrap">
    <h1 class="hero-title" data-i18n="heroTitle">ماذا تريد أن تعلن عنه اليوم؟</h1>
    <p class="hero-lead" data-i18n="heroLead"></p>

    <div class="composer" id="composer">
      <div class="attach-row" id="attachRow" hidden>
        <img id="thumb" alt="">
        <span id="fileName"></span>
        <button type="button" class="mini-x" id="removePhoto" data-i18n-aria="removePhoto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <label class="sr-only" for="desc" data-i18n="descLabel">وصف المنتج</label>
      <textarea id="desc" maxlength="1000" rows="1" data-i18n-ph="descPlaceholder"></textarea>

      <div class="composer-bar">
        <label class="attach-btn" for="photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.8" cy="9.8" r="1.7"/><path d="M21 16l-5-5-7.5 7.5"/></svg>
          <span data-i18n="attach">أرفق صورة</span>
        </label>
        <input class="sr-only" type="file" id="photo" accept="image/*">
        <span class="counter" id="counter"></span>
        <button type="button" class="send" id="go" data-i18n-aria="generate">
          <span class="spinner" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
        </button>
      </div>
    </div>

    <div class="chips" id="chips"></div>
    <p class="hint" data-i18n="hint"></p>
    <p class="status" id="msg" role="status" aria-live="polite"></p>
  </section>

  <section id="results" class="results wrap" aria-labelledby="resultsTitle">
    <div class="results-bar">
      <div>
        <h2 id="resultsTitle" data-i18n="resultsTitle">شرائحك جاهزة</h2>
        <p class="results-sub" data-i18n="resultsSub"></p>
      </div>
      <button type="button" class="btn-ghost" id="all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5"/><path d="M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17"/></svg>
        <span data-i18n="downloadAll">تحميل الكل</span>
      </button>
    </div>
    <p class="note" id="resultNote" hidden></p>
    <div class="slides" id="slides"></div>
  </section>

  <footer>
    <p data-i18n="footer"></p>
  </footer>
</main>
</div>

<script>
/* ============================================================
   1) النصوص بكل لغة
   ============================================================ */
const I18N = {
  ar: {
    title: 'مولّد المنشورات — شرائح احترافية بالذكاء الاصطناعي',
    metaDesc: 'حوّل وصف منتجك إلى أربع شرائح جاهزة للنشر بالعربية الفصحى أو الإنجليزية.',
    brand: 'مولّد المنشورات',
    langGroup: 'اختيار اللغة',

/* ============================================================
   2) الحالة والعناصر
   ============================================================ */
const $ = (id) => document.getElementById(id);
const root = document.documentElement;
const isTouch = window.matchMedia && matchMedia('(pointer: coarse)').matches;

const state = {
  lang: root.lang === 'en' ? 'en' : 'ar',
  theme: root.dataset.theme === 'light' ? 'light' : 'dark',
  img: null,
  last: null // { data, lang }
};

const els = {
  desc: $('desc'), counter: $('counter'), chips: $('chips'),
  photo: $('photo'), composer: $('composer'), thumb: $('thumb'), fileName: $('fileName'),
  attachRow: $('attachRow'), removePhoto: $('removePhoto'),
  go: $('go'), msg: $('msg'), results: $('results'), slides: $('slides'),
  note: $('resultNote'), all: $('all'), themeBtn: $('themeBtn')
};

const dict = () => I18N[state.lang];

function savePrefs() {
  try {
    localStorage.setItem('carousel-prefs', JSON.stringify({ lang: state.lang, theme: state.theme }));
  } catch (e) {}
}

/* ============================================================
   3) اللغة
   ============================================================ */
function applyLang(lang, opts) {
  state.lang = lang;
  const d = I18N[lang];

  root.lang = lang;
  root.dir = lang === 'en' ? 'ltr' : 'rtl';
  document.title = d.title;

  const meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute('content', d.metaDesc);

  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const value = d[el.dataset.i18n];
    if (typeof value === 'string') el.textContent = value;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => {
    el.setAttribute('placeholder', d[el.dataset.i18nPh] || '');
  });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
    el.setAttribute('aria-label', d[el.dataset.i18nAria] || '');
  });
  const hint = document.querySelector('.hint');
  if (hint) hint.textContent = isTouch ? d.hintTouch : d.hint;
  els.go.title = d.generate;
  els.removePhoto.title = d.removePhoto;

  document.querySelectorAll('.seg-btn').forEach((btn) => {
    btn.setAttribute('aria-pressed', String(btn.dataset.lang === lang));
  });

  buildChips();
  updateCounter();
  updateThemeLabel();
  if (state.last) render();
  if (!opts || opts.save !== false) savePrefs();
}

function buildChips() {
  const d = dict();
  els.chips.innerHTML = '';
  d.examples.forEach((ex) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip';
    btn.textContent = ex.label;
    btn.addEventListener('click', () => {
      els.desc.value = ex.text;
      updateCounter();
      autosize();
      els.desc.focus();
    });
    els.chips.appendChild(btn);
  });
}

/* ============================================================
   4) المظهر (ليلي / نهاري)
   ============================================================ */
function applyTheme(theme, opts) {
  state.theme = theme;
  root.dataset.theme = theme;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#090a12' : '#f5f6fd');
  updateThemeLabel();
  if (!opts || opts.save !== false) savePrefs();
}

function updateThemeLabel() {
  const d = dict();
  const toDark = state.theme === 'light';
  els.themeBtn.setAttribute('aria-pressed', String(!toDark));
  els.themeBtn.setAttribute('aria-label', toDark ? d.themeToDark : d.themeToLight);
  els.themeBtn.title = toDark ? d.themeToDark : d.themeToLight;
}

/* ============================================================
   5) شريط الإدخال والصورة
   ============================================================ */
function updateCounter() {
  const n = els.desc.value.length;
  els.counter.textContent = n ? n + ' / 1000' : '';
  els.counter.classList.toggle('near', n > 900);
}

function autosize() {
  els.desc.style.height = 'auto';
  els.desc.style.height = Math.min(els.desc.scrollHeight, 220) + 'px';
}

els.desc.addEventListener('input', () => { updateCounter(); autosize(); });

function setStatus(text, isErr, busy) {
  els.msg.textContent = text || '';
  els.msg.className = 'status' + (isErr ? ' err' : '') + (busy ? ' busy' : '');
}

function setFile(file) {
  if (!file) {
    state.img = null;
    els.photo.value = '';
    els.attachRow.hidden = true;
    els.thumb.removeAttribute('src');
    els.fileName.textContent = '';
    if (state.last) render();
    return;
  }
  if (!file.type.startsWith('image/')) { setStatus(dict().errors.generic, true); return; }
  const img = new Image();
  img.onload = () => {
    state.img = img;
    els.thumb.src = img.src;
    els.fileName.textContent = file.name;
    els.attachRow.hidden = false;
    if (state.last) render();
  };
  img.onerror = () => setStatus(dict().errors.generic, true);
  img.src = URL.createObjectURL(file);
}

els.photo.addEventListener('change', (e) => setFile(e.target.files && e.target.files[0]));
els.removePhoto.addEventListener('click', () => setFile(null));

['dragenter', 'dragover'].forEach((evt) => {
  els.composer.addEventListener(evt, (e) => { e.preventDefault(); els.composer.classList.add('is-drag'); });
});
['dragleave', 'dragend'].forEach((evt) => {
  els.composer.addEventListener(evt, () => els.composer.classList.remove('is-drag'));
});
els.composer.addEventListener('drop', (e) => {
  e.preventDefault();
  els.composer.classList.remove('is-drag');
  const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (file) setFile(file);
});

/* ============================================================
   6) الإنشاء
   ============================================================ */
async function generate() {
  if (els.go.disabled) return;
  const d = dict();
  const description = els.desc.value.trim();
  if (!description) {
    setStatus(d.errors.empty, true);
    els.desc.focus();
    return;
  }

  els.go.disabled = true;
  els.go.classList.add('is-loading');
  setStatus(d.generating, false, true);

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description, lang: state.lang })
    });

    let data = null;
    try { data = await res.json(); } catch (e) {}

    if (!res.ok) {
      const code = data && data.code;
      setStatus((code && d.errors[code]) || (data && data.error) || d.errors.generic, true);
      return;
    }
    if (!data || !Array.isArray(data.slides) || data.slides.length < 1) {
      setStatus(d.errors.incomplete, true);
      return;
    }

    state.last = { data, lang: state.lang };
    await ensureFonts(state.lang);
    render();
    setStatus('');
    els.results.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    setStatus(d.errors.network_error, true);
  } finally {
    els.go.disabled = false;
    els.go.classList.remove('is-loading');
  }
}

els.go.addEventListener('click', generate);
els.desc.addEventListener('keydown', (e) => {
  if (e.isComposing) return;
  const submit = e.key === 'Enter' && (e.ctrlKey || e.metaKey || (!e.shiftKey && !isTouch));
  if (submit) { e.preventDefault(); generate(); }
});

async function ensureFonts(lang) {
  if (!document.fonts || !document.fonts.load) return;
  const fam = lang === 'ar' ? 'Tajawal' : 'Inter';
  try {
    await Promise.all([
      document.fonts.load("800 80px '" + fam + "'"),
      document.fonts.load("400 40px '" + fam + "'")
    ]);
    await document.fonts.ready;
  } catch (e) {}
}

/* ============================================================
   7) قوالب الرسم
   ============================================================ */
const SIZE = 1080;
const CANVAS_FONT = {
  ar: "'Tajawal', Arial, sans-serif",
  en: "'Inter', Arial, sans-serif"
};

// ألوان هادئة ومريحة للعين، والذكاء الاصطناعي يختار منها
const THEMES = {
  ivory:  { bg: '#F4EFE6', bg2: '#EAE3D5', text: '#2A2926', accent: '#7A5C3E' },
  sage:   { bg: '#E3E9E0', bg2: '#D5DFD2', text: '#22302A', accent: '#3E6B52' },
  rose:   { bg: '#F5E8E6', bg2: '#EBD7D4', text: '#3A2A2E', accent: '#9A4A5C' },
  navy:   { bg: '#1C2B40', bg2: '#16233A', text: '#EDF0F4', accent: '#C9A96B' },
  forest: { bg: '#1F3B33', bg2: '#183029', text: '#F1EEE6', accent: '#D8BA7C' },
  slate:  { bg: '#2C3037', bg2: '#23272D', text: '#ECEDEF', accent: '#86BBA6' }
};

// align: c = في الوسط، s = إلى الجانب | v: c = وسط، b = أسفل
const LAYOUTS = {
  frame:     { align: 'c', v: 'c', st: 130, sb: 150 },
  editorial: { align: 's', v: 'c', st: 130, sb: 150 },
  band:      { align: 'c', v: 'c', st: 130, sb: 150 },
  circle:    { align: 'c', v: 'c', st: 130, sb: 150 },
  card:      { align: 'c', v: 'c', st: 140, sb: 160 },
  numeral:   { align: 's', v: 'b', st: 130, sb: 150 },
  header:    { align: 'c', v: 'c', st: 230, sb: 150 },
  diagonal:  { align: 's', v: 'c', st: 130, sb: 150 }
};

/* ============================================================
   8) ضبط الألوان القادمة من الذكاء الاصطناعي
   ============================================================ */
const HEX = /^#[0-9a-fA-F]{6}$/;

function hexToHsl(h) {
  const n = parseInt(h.slice(1), 16);
  const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let H = 0, S = 0;
  const L = (mx + mn) / 2;
  if (d) {
    S = d / (1 - Math.abs(2 * L - 1));
    if (mx === r) H = ((g - b) / d) % 6;
    else if (mx === g) H = (b - r) / d + 2;
    else H = (r - g) / d + 4;
    H *= 60;
    if (H < 0) H += 360;
  }
  return [H, S, L];
}

function hsl(H, S, L) {
  const c = (1 - Math.abs(2 * L - 1)) * S, x = c * (1 - Math.abs(((H / 60) % 2) - 1)), m = L - c / 2;
  let r = 0, g = 0, b = 0;
  if (H < 60) [r, g, b] = [c, x, 0];
  else if (H < 120) [r, g, b] = [x, c, 0];
  else if (H < 180) [r, g, b] = [0, c, x];
  else if (H < 240) [r, g, b] = [0, x, c];
  else if (H < 300) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];
  const f = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
  return '#' + f(r) + f(g) + f(b);
}

const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

function harmonize(p) {
  if (!p || !HEX.test(p.bg) || !HEX.test(p.accent)) return null;
  const [bh, bs0, bl0] = hexToHsl(p.bg);
  const dark = bl0 < 0.5, bs = Math.min(bs0, 0.32);
  const bl = dark ? clamp(bl0, 0.12, 0.25) : clamp(bl0, 0.88, 0.95);
  const [ah, as0, al0] = hexToHsl(p.accent);
  return {
    bg: hsl(bh, bs, bl),
    bg2: hsl(bh, bs, dark ? bl - 0.04 : bl - 0.05),
    text: dark ? hsl(bh, 0.15, 0.94) : hsl(bh, 0.25, 0.14),
    accent: hsl(ah, Math.min(as0, 0.5), dark ? clamp(al0, 0.6, 0.75) : clamp(al0, 0.25, 0.4))
  };
}

function pickTheme(data) {
  return harmonize(data && data.palette) || THEMES[data && data.theme] || THEMES.ivory;
}

/* ============================================================
   9) الرسم على Canvas
   ============================================================ */
const ICON_DOWNLOAD =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M12 3v11m0 0 4-4m-4 4-4-4"/><path d="M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></svg>';

function render() {
  if (!state.last) return;
  const { data, lang } = state.last;
  const d = dict();
  const theme = pickTheme(data);
  const layout = LAYOUTS[data.layout] ? data.layout : 'frame';
  const imgPos = data.imagePosition === 'bottom' ? 'bottom' : 'top';
  const slides = data.slides.slice(0, 4);

  els.slides.innerHTML = '';

  slides.forEach((slide, i) => {
    const canvas = document.createElement('canvas');
    canvas.width = SIZE;
    canvas.height = SIZE;
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', d.slideAlt + ' ' + (i + 1));
    drawSlide(canvas.getContext('2d'), slide, i, slides.length, theme, layout, imgPos, lang);

    const card = document.createElement('article');
    card.className = 'slide-card';

    const head = document.createElement('div');
    head.className = 'slide-head';
    const idx = document.createElement('span');
    idx.className = 'slide-index';
    idx.textContent = String(i + 1).padStart(2, '0');
    const role = document.createElement('span');
    role.className = 'slide-role';
    role.textContent = (d.slideRoles && d.slideRoles[i]) || '';
    head.append(idx, role);

    const foot = document.createElement('div');
    foot.className = 'slide-foot';
    const dl = document.createElement('button');
    dl.type = 'button';
    dl.className = 'btn-ghost';
    dl.innerHTML = ICON_DOWNLOAD;
    const dlLabel = document.createElement('span');
    dlLabel.textContent = d.downloadSlide;
    dl.appendChild(dlLabel);
    dl.addEventListener('click', () => download(canvas, i));
    foot.appendChild(dl);

    card.append(head, canvas, foot);
    els.slides.appendChild(card);
  });

  els.results.classList.add('show');
  els.note.hidden = state.last.lang === state.lang;
  els.note.textContent = d.noteSwitch;
}

function drawSlide(ctx, slide, i, count, t, layoutName, imgPos, lang) {
  const L = LAYOUTS[layoutName];
  const RTL = lang === 'ar';
  const FONT = CANVAS_FONT[lang];

  const g = ctx.createLinearGradient(0, 0, 0, SIZE);
  g.addColorStop(0, t.bg);
  g.addColorStop(1, t.bg2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SIZE, SIZE);

  decorate(ctx, t, layoutName, i);

  // الصورة: الشريحة الأولى والأخيرة
  const hasImg = state.img && (i === 0 || i === count - 1);
  let top = L.st, bottom = SIZE - L.sb;
  if (hasImg) {
    const maxW = 780, maxH = 390, pad = 24;
    const r = Math.min(maxW / state.img.width, maxH / state.img.height);
    const iw = state.img.width * r, ih = state.img.height * r;
    const cw = iw + pad * 2, ch = ih + pad * 2;
    const cx0 = (SIZE - cw) / 2;
    const cy0 = imgPos === 'top' ? L.st - 20 : SIZE - L.sb + 10 - ch;
    drawImageCard(ctx, state.img, cx0, cy0, cw, ch, pad, t);
    if (imgPos === 'top') top = cy0 + ch + 30;
    else { top = L.st - 10; bottom = cy0 - 30; }
  }

  const isList = i === 2;
  const side = L.align === 's' || isList;
  const edge = RTL ? SIZE - 150 : 150;
  const maxW = side ? SIZE - 340 : SIZE - 240;
  const listIndent = 50;

  const title = String(slide.title || '');
  const raw = String(slide.body || '');

  let tS = hasImg ? 68 : 92;
  let bS = hasImg ? 38 : 48;
  let tl = [], items = [], total = 0;
  const avail = Math.max(200, bottom - top);

  const build = () => {
    ctx.font = '800 ' + tS + 'px ' + FONT;
    tl = wrap(ctx, title, maxW);
    ctx.font = '400 ' + bS + 'px ' + FONT;
    items = isList
      ? raw.split('\n').map((l) => l.replace(/^[-•✓*\s]+/, '').trim()).filter(Boolean).map((l) => wrap(ctx, l, maxW - listIndent))
      : [wrap(ctx, raw, maxW)];

    const tLH = tS * (RTL ? 1.34 : 1.18);
    const bLH = bS * (RTL ? 1.62 : 1.55);
    const gap = isList ? 22 : 0;
    const bodyH = items.reduce((sum, lines) => sum + lines.length * bLH, 0) + gap * Math.max(0, items.length - 1);
    total = tl.length * tLH + 44 + bodyH;
    return { tLH, bLH, gap };
  };

  let m = build();
  let guard = 0;
  while (total > avail && guard++ < 60) {
    if (tS > 56) tS -= 4;
    else if (bS > 30) bS -= 2;
    else break;
    m = build();
  }

  const free = Math.max(0, avail - total);
  let y = top + (L.v === 'b' ? free : free / 2) + tS;
  const startY = y;

  ctx.direction = RTL ? 'rtl' : 'ltr';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = side ? (RTL ? 'right' : 'left') : 'center';
  const tx = side ? edge : SIZE / 2;

  // العنوان
  ctx.fillStyle = t.text;
  ctx.font = '800 ' + tS + 'px ' + FONT;
  tl.forEach((line) => { ctx.fillText(line, tx, y); y += m.tLH; });
  const lastBase = y - m.tLH;

  // خط تمييز تحت العنوان في التخطيطات الوسطية
  if (!side) {
    ctx.fillStyle = t.accent;
    ctx.fillRect(SIZE / 2 - 45, lastBase + 26, 90, 6);
  }

  // النص
  y = lastBase + 44 + bS;
  ctx.font = '400 ' + bS + 'px ' + FONT;
  items.forEach((lines) => {
    if (isList) {
      ctx.fillStyle = t.accent;
      ctx.beginPath();
      ctx.arc(RTL ? edge - 14 : edge + 14, y - bS * 0.3, 9, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = t.text;
    ctx.globalAlpha = 0.92;
    const lineX = isList ? (RTL ? edge - listIndent : edge + listIndent) : tx;
    lines.forEach((line) => { ctx.fillText(line, lineX, y); y += m.bLH; });
    ctx.globalAlpha = 1;
    y += m.gap;
  });

  // خط رأسي بلون التمييز للتخطيطات الجانبية وقائمة الفوائد
  if (side && (layoutName === 'editorial' || isList)) {
    const barTop = startY - tS * 0.82;
    const barH = Math.max(60, (y - m.gap - bS * 0.35) - barTop);
    ctx.fillStyle = t.accent;
    ctx.fillRect(RTL ? SIZE - 108 : 100, barTop, 6, barH);
  }

  // مؤشر الشرائح
  const dots = Math.min(count, 4);
  ctx.direction = 'ltr';
  for (let k = 0; k < dots; k++) {
    ctx.beginPath();
    ctx.arc(SIZE / 2 + (k - (dots - 1) / 2) * 34, SIZE - 86, 8, 0, Math.PI * 2);
    ctx.fillStyle = t.accent;
    ctx.globalAlpha = k === i ? 1 : 0.3;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function decorate(ctx, t, name, i) {
  ctx.save();
  ctx.fillStyle = t.accent;
  ctx.strokeStyle = t.accent;

  if (name === 'band') {
    ctx.fillRect(0, 0, 36, SIZE);
  } else if (name === 'circle') {
    ctx.globalAlpha = 0.1;
    ctx.beginPath(); ctx.arc(SIZE / 2, SIZE / 2, 430, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.35; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(SIZE / 2, SIZE / 2, 430, 0, Math.PI * 2); ctx.stroke();
  } else if (name === 'card') {
    ctx.fillRect(0, 0, SIZE, SIZE);
    const g = ctx.createLinearGradient(0, 0, 0, SIZE);
    g.addColorStop(0, t.bg); g.addColorStop(1, t.bg2);
    ctx.fillStyle = g;
    roundRect(ctx, 56, 56, SIZE - 112, SIZE - 112, 36);
    ctx.fill();
  } else if (name === 'numeral') {
    ctx.globalAlpha = 0.1;
    ctx.font = '800 560px ' + CANVAS_FONT.en;
    ctx.direction = 'ltr';
    ctx.textAlign = 'left';
    ctx.fillText(String(i + 1), 60, 560);
  } else if (name === 'header') {
    ctx.fillRect(0, 0, SIZE, 150);
  } else if (name === 'diagonal') {
    ctx.globalAlpha = 0.12;
    ctx.beginPath();
    ctx.moveTo(0, 720); ctx.lineTo(SIZE, 220); ctx.lineTo(SIZE, 400); ctx.lineTo(0, 900);
    ctx.closePath(); ctx.fill();
  } else if (name !== 'editorial') { // frame
    ctx.globalAlpha = 0.45; ctx.lineWidth = 2;
    ctx.strokeRect(48, 48, SIZE - 96, SIZE - 96);
  }

  ctx.restore();
}

function drawImageCard(ctx, img, x, y, w, h, pad, c) {
  ctx.save();
  roundRect(ctx, x, y, w, h, 28);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.restore();

  ctx.save();
  roundRect(ctx, x + pad / 2, y + pad / 2, w - pad, h - pad, 18);
  ctx.clip();
  ctx.drawImage(img, x + pad, y + pad, w - pad * 2, h - pad * 2);
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = c.accent;
  ctx.lineWidth = 3;
  roundRect(ctx, x, y, w, h, 28);
  ctx.stroke();
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// تقسيم النص إلى أسطر حسب العرض المتاح
function wrap(ctx, text, maxW) {
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  words.forEach((w) => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  return lines;
}

/* ============================================================
   10) التحميل
   ============================================================ */
function download(canvas, i) {
  canvas.toBlob((blob) => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'carousel-' + (i + 1) + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }, 'image/png');
}

els.all.addEventListener('click', () => {
  const canvases = els.slides.querySelectorAll('canvas');
  if (!canvases.length) return;
  els.all.disabled = true;
  canvases.forEach((cv, i) => setTimeout(() => download(cv, i), i * 550));
  setTimeout(() => { els.all.disabled = false; }, canvases.length * 550 + 800);
});

/* ============================================================
   11) ربط الأزرار والتشغيل
   ============================================================ */
document.querySelectorAll('.seg-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    if (btn.dataset.lang !== state.lang) applyLang(btn.dataset.lang);
  });
});

els.themeBtn.addEventListener('click', () => {
  applyTheme(state.theme === 'dark' ? 'light' : 'dark');
});

applyLang(state.lang, { save: false });
applyTheme(state.theme, { save: false });
autosize();
</script>
